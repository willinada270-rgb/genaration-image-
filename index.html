<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Générateur IA — Dobleyou</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --orange: #FF7A1A;
    --orange-deep: #CC4500;
    --orange-soft: rgba(255,122,26,.14);
    --orange-glow: rgba(255,122,26,.45);
    --bg: #08060A;
    --surface: #14100E;
    --surface-2: #1C1714;
    --line: rgba(255,255,255,.09);
    --line-strong: rgba(255,255,255,.16);
    --text: #FAF7F2;
    --muted: #B9B2A8;
    --green: #22C55E;
    --red: #F87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Poppins', system-ui, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, rgba(255,122,26,.10), transparent 60%), var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 32px 16px 80px;
    line-height: 1.5;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 36px; }
  header h1 { font-size: 30px; font-weight: 800; letter-spacing: -.5px; }
  header h1 span { color: var(--orange); }
  header p { color: var(--muted); margin-top: 8px; font-size: 15px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }

  .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
  .tab {
    flex: 1; padding: 12px; border-radius: 12px; cursor: pointer;
    background: var(--surface-2); border: 1px solid var(--line);
    color: var(--muted); font-weight: 600; font-size: 15px; text-align: center;
    transition: .15s;
  }
  .tab.active { background: var(--orange-soft); border-color: var(--orange); color: var(--orange); }

  label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 8px; }
  textarea, input[type=url] {
    width: 100%; background: var(--surface-2); border: 1px solid var(--line-strong);
    border-radius: 12px; color: var(--text); padding: 14px; font-family: inherit;
    font-size: 15px; resize: vertical; transition: .15s;
  }
  textarea { min-height: 110px; }
  textarea:focus, input:focus { outline: none; border-color: var(--orange); }

  .field { margin-bottom: 18px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  #videoImageField { display: none; }

  button.go {
    width: 100%; padding: 16px; border: none; border-radius: 14px; cursor: pointer;
    background: linear-gradient(135deg, var(--orange), var(--orange-deep));
    color: #fff; font-family: inherit; font-weight: 700; font-size: 16px;
    box-shadow: 0 12px 30px var(--orange-soft); transition: .15s;
  }
  button.go:hover { transform: translateY(-1px); box-shadow: 0 16px 40px var(--orange-glow); }
  button.go:disabled { opacity: .55; cursor: not-allowed; transform: none; }

  #status { margin-top: 20px; text-align: center; font-size: 14px; min-height: 22px; }
  #status.err { color: var(--red); }
  .spinner {
    display: inline-block; width: 16px; height: 16px; vertical-align: -3px; margin-right: 8px;
    border: 2px solid var(--line-strong); border-top-color: var(--orange);
    border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #result { margin-top: 24px; display: none; }
  #result img, #result video { width: 100%; border-radius: 14px; border: 1px solid var(--line); }
  .dl {
    display: inline-block; margin-top: 14px; padding: 10px 18px; border-radius: 10px;
    background: var(--surface-2); border: 1px solid var(--line-strong); color: var(--text);
    text-decoration: none; font-weight: 600; font-size: 14px;
  }
  .dl:hover { border-color: var(--orange); color: var(--orange); }

  /* --- Chat --- */
  .panel { display: none; }
  .panel.active { display: block; }
  #chatLog {
    display: flex; flex-direction: column; gap: 12px;
    max-height: 420px; overflow-y: auto; padding: 4px; margin-bottom: 16px;
  }
  .msg { padding: 12px 16px; border-radius: 14px; font-size: 15px; max-width: 85%; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: var(--orange-soft); border: 1px solid var(--orange); }
  .msg.bot { align-self: flex-start; background: var(--surface-2); border: 1px solid var(--line); }
  .msg.bot.typing { color: var(--muted); font-style: italic; }
  .chat-row { display: flex; gap: 8px; }
  .chat-row textarea { min-height: 52px; }
  .chat-row button {
    border: none; border-radius: 12px; cursor: pointer; padding: 0 22px;
    background: linear-gradient(135deg, var(--orange), var(--orange-deep));
    color: #fff; font-family: inherit; font-weight: 700; font-size: 15px;
  }
  .chat-row button:disabled { opacity: .55; cursor: not-allowed; }
  .chat-empty { color: var(--muted); text-align: center; font-size: 14px; padding: 30px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Générateur <span>IA</span></h1>
    <p>Images, vidéos & chat IA — Replicate + Claude Sonnet 4.6</p>
  </header>

  <div class="card">
    <div class="tabs">
      <div class="tab active" data-tab="image">🖼️ Image</div>
      <div class="tab" data-tab="video">🎬 Vidéo</div>
      <div class="tab" data-tab="chat">💬 Chat</div>
    </div>

    <!-- Panneau génération (image + vidéo) -->
    <div class="panel active" id="genPanel">
      <div class="field">
        <label for="prompt">Décris ce que tu veux générer</label>
        <textarea id="prompt" placeholder="Ex : un coucher de soleil cinématique sur une ville africaine, lumière dorée, ultra détaillé"></textarea>
        <div class="hint">Sois précis : style, lumière, ambiance, cadrage. L'anglais marche souvent mieux pour la qualité.</div>
      </div>

      <div class="field" id="videoImageField">
        <label for="imageUrl">Image de départ (optionnel — pour animer une image)</label>
        <input type="url" id="imageUrl" placeholder="https://... (URL d'une image publique)" />
        <div class="hint">Laisse vide pour une vidéo à partir du texte seul.</div>
      </div>

      <button class="go" id="goBtn">Générer</button>

      <div id="status"></div>
      <div id="result"></div>
    </div>

    <!-- Panneau chat (Claude Sonnet 4.6) -->
    <div class="panel" id="chatPanel">
      <div id="chatLog">
        <div class="chat-empty">Pose ta question à Claude Sonnet 4.6 👋</div>
      </div>
      <div class="chat-row">
        <textarea id="chatInput" placeholder="Écris ton message…"></textarea>
        <button id="chatSend">Envoyer</button>
      </div>
    </div>
  </div>
</div>

<script>
  let currentType = "image";
  const tabs = document.querySelectorAll(".tab");
  const genPanel = document.getElementById("genPanel");
  const chatPanel = document.getElementById("chatPanel");
  const videoImageField = document.getElementById("videoImageField");
  const goBtn = document.getElementById("goBtn");
  const statusEl = document.getElementById("status");
  const resultEl = document.getElementById("result");

  tabs.forEach((tab) => {
    tab.addEventListener("click", () => {
      tabs.forEach((t) => t.classList.remove("active"));
      tab.classList.add("active");
      const which = tab.dataset.tab;

      if (which === "chat") {
        genPanel.classList.remove("active");
        chatPanel.classList.add("active");
        return;
      }

      chatPanel.classList.remove("active");
      genPanel.classList.add("active");
      currentType = which; // image | video
      videoImageField.style.display = currentType === "video" ? "block" : "none";
    });
  });

  goBtn.addEventListener("click", async () => {
    const prompt = document.getElementById("prompt").value.trim();
    const imageUrl = document.getElementById("imageUrl").value.trim();
    if (!prompt) {
      setStatus("Écris d'abord un prompt.", true);
      return;
    }

    goBtn.disabled = true;
    resultEl.style.display = "none";
    resultEl.innerHTML = "";
    setStatus(
      '<span class="spinner"></span>' +
        (currentType === "video"
          ? "Génération de la vidéo… (peut prendre 1 à 2 minutes)"
          : "Génération de l'image…")
    );

    try {
      const res = await fetch("/api/generate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          type: currentType,
          prompt,
          imageUrl: currentType === "video" && imageUrl ? imageUrl : undefined,
        }),
      });
      const data = await res.json();

      if (!res.ok || !data.url) {
        throw new Error(data.error || "Échec de la génération.");
      }

      setStatus("✅ Terminé !");
      if (currentType === "video") {
        resultEl.innerHTML =
          '<video src="' + data.url + '" controls autoplay loop></video>' +
          '<a class="dl" href="' + data.url + '" download target="_blank">⬇️ Télécharger la vidéo</a>';
      } else {
        resultEl.innerHTML =
          '<img src="' + data.url + '" alt="Image générée" />' +
          '<a class="dl" href="' + data.url + '" download target="_blank">⬇️ Télécharger l\'image</a>';
      }
      resultEl.style.display = "block";
    } catch (err) {
      setStatus(err.message || "Une erreur est survenue.", true);
    } finally {
      goBtn.disabled = false;
    }
  });

  function setStatus(html, isError) {
    statusEl.innerHTML = html;
    statusEl.className = isError ? "err" : "";
  }

  /* ----- Chat avec Claude Sonnet 4.6 ----- */
  const chatLog = document.getElementById("chatLog");
  const chatInput = document.getElementById("chatInput");
  const chatSend = document.getElementById("chatSend");
  const history = []; // { role: 'user'|'assistant', content }

  function addMessage(role, text, extraClass) {
    const empty = chatLog.querySelector(".chat-empty");
    if (empty) empty.remove();
    const div = document.createElement("div");
    div.className = "msg " + (role === "user" ? "user" : "bot") + (extraClass ? " " + extraClass : "");
    div.textContent = text;
    chatLog.appendChild(div);
    chatLog.scrollTop = chatLog.scrollHeight;
    return div;
  }

  async function sendChat() {
    const text = chatInput.value.trim();
    if (!text) return;

    addMessage("user", text);
    history.push({ role: "user", content: text });
    chatInput.value = "";
    chatSend.disabled = true;

    const typing = addMessage("assistant", "Claude réfléchit…", "typing");

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history }),
      });
      const data = await res.json();
      if (!res.ok || !data.reply) throw new Error(data.error || "Échec de la réponse.");

      typing.classList.remove("typing");
      typing.textContent = data.reply;
      history.push({ role: "assistant", content: data.reply });
    } catch (err) {
      typing.classList.remove("typing");
      typing.style.color = "var(--red)";
      typing.textContent = "⚠️ " + (err.message || "Erreur.");
    } finally {
      chatSend.disabled = false;
      chatLog.scrollTop = chatLog.scrollHeight;
    }
  }

  chatSend.addEventListener("click", sendChat);
  chatInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendChat();
    }
  });
</script>
</body>
</html>
