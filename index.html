<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Générateur d'images et de vidéos par IA, et chat avec Claude Sonnet 4.6. Outil Dobleyou." />
<meta name="theme-color" content="#0d0b0c" />
<meta name="color-scheme" content="dark" />
<title>Générateur IA — Dobleyou</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --orange: #FF7A1A;
    --orange-hover: #FF8C38;
    --orange-soft: rgba(255,122,26,.13);
    --bg: #0d0b0c;
    --sidebar: #100e0f;
    --surface: #1a1517;
    --surface-2: #221c1e;
    --line: rgba(255,255,255,.08);
    --line-strong: rgba(255,255,255,.14);
    --text: #F3EFEA;
    --muted: #968F88;
    --green: #34D399;
    --red: #F87171;
    --radius: 12px;
    --ease: cubic-bezier(.4, 0, .2, 1);
    --t-fast: .15s var(--ease);
    --focus: 0 0 0 3px rgba(255,122,26,.45);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :focus-visible { outline: none; box-shadow: var(--focus); border-radius: 8px; }
  *:focus:not(:focus-visible) { outline: none; }
  ::selection { background: rgba(255,122,26,.35); color: #fff; }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 99px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.22); }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  body { font-family: 'Poppins', system-ui, sans-serif; color: var(--text); background: var(--bg); line-height: 1.5; min-height: 100vh; }
  .layout { display: flex; min-height: 100vh; }

  /* ---------- Sidebar ---------- */
  .sidebar { width: 264px; flex: none; height: 100vh; position: sticky; top: 0; background: var(--sidebar); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 16px; }
  .side-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 800; letter-spacing: -.3px; }
  .brand b { color: var(--orange); }
  .brand-dot { width: 24px; height: 24px; border-radius: 7px; flex: none; background: radial-gradient(circle at 35% 30%, #ffd9b0, var(--orange) 55%, #b53e00); box-shadow: 0 0 14px rgba(255,122,26,.45); }
  .drawer-close { display: none; background: none; border: none; color: var(--muted); cursor: pointer; font-size: 24px; line-height: 1; padding: 0 4px; }
  .drawer-close:hover { color: var(--orange); }

  .nav { display: flex; flex-direction: column; gap: 4px; margin-bottom: 20px; }
  .tab { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; padding: 11px 12px; border-radius: 9px; cursor: pointer; background: transparent; border: 1px solid transparent; color: var(--muted); font-family: inherit; font-weight: 600; font-size: 14px; transition: background var(--t-fast), color var(--t-fast); }
  .tab svg { width: 18px; height: 18px; flex: none; }
  .tab .tab-label { flex: 1; }
  .tab:hover:not(.active) { background: var(--surface); color: var(--text); }
  .tab.active { background: var(--orange-soft); color: var(--orange); }

  .side-section { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .side-title { font-size: 11px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: var(--muted); margin: 4px 4px 10px; }
  .hist-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; margin: 0 -4px; padding: 0 4px; }
  .hist-item { display: flex; gap: 10px; align-items: center; cursor: pointer; background: transparent; border: 1px solid transparent; border-radius: 9px; padding: 6px; transition: background var(--t-fast), border-color var(--t-fast); }
  .hist-item:hover { background: var(--surface); border-color: var(--line); }
  .hist-item img { width: 38px; height: 38px; border-radius: 7px; object-fit: cover; flex: none; background: #000; }
  .hist-thumb-icon { width: 38px; height: 38px; border-radius: 7px; flex: none; display: flex; align-items: center; justify-content: center; background: var(--surface-2); color: var(--orange); }
  .hist-thumb-icon svg { width: 18px; height: 18px; }
  .hist-meta { min-width: 0; }
  .hist-meta .t { font-size: 10px; color: var(--orange); font-weight: 700; text-transform: uppercase; letter-spacing: .4px; }
  .hist-meta .p { font-size: 13px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hist-empty { color: var(--muted); font-size: 13px; text-align: center; padding: 24px 8px; }

  .side-foot { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 7px; }
  .row2 { display: flex; gap: 7px; }
  .hist-btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); color: var(--text); border-radius: 9px; padding: 9px; font-family: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; transition: color var(--t-fast), border-color var(--t-fast), transform var(--t-fast); }
  .hist-btn svg { width: 14px; height: 14px; }
  .hist-btn:hover:not(:disabled) { color: var(--orange); border-color: var(--orange); }
  .hist-btn:active:not(:disabled) { transform: scale(.97); }
  .hist-btn:disabled { opacity: .45; cursor: not-allowed; }
  .backup-status { font-size: 11.5px; color: var(--muted); text-align: center; min-height: 14px; }
  .backup-status.active { color: var(--green); }
  .backup-status.warn { color: var(--orange); }
  .hist-clear { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 9px; padding: 8px; font-family: inherit; font-size: 12.5px; cursor: pointer; transition: color var(--t-fast), border-color var(--t-fast); }
  .hist-clear:hover { color: var(--red); border-color: var(--red); }

  /* ---------- Main ---------- */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100vh; }
  .topbar { display: flex; align-items: center; gap: 12px; padding: 0 clamp(16px, 4vw, 32px); height: 62px; border-bottom: 1px solid var(--line); flex: none; }
  .menu-btn { display: none; background: var(--surface); border: 1px solid var(--line); color: var(--text); border-radius: 9px; width: 40px; height: 40px; cursor: pointer; align-items: center; justify-content: center; }
  .menu-btn svg { width: 20px; height: 20px; }
  .topbar h1 { font-size: 17px; font-weight: 700; letter-spacing: -.2px; }

  .content { flex: 1; overflow-y: auto; padding: clamp(18px, 3vw, 28px) clamp(16px, 4vw, 32px) 24px; display: flex; flex-direction: column; }
  .panel { display: none; flex: 1; max-width: 760px; width: 100%; margin: 0 auto; flex-direction: column; min-height: 0; }
  .panel.active { display: flex; animation: fadeUp .25s var(--ease); }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* ---------- Fil de conversation (chat + génération) ---------- */
  .thread { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 6px 2px; margin-bottom: 14px; }
  .msg { padding: 12px 16px; border-radius: 14px; font-size: 15px; max-width: 85%; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--orange-soft); border: 1px solid rgba(255,122,26,.4); }
  /* Réponse IA sans bulle : texte nu sur le fond (façon Voxa) */
  .msg.bot { align-self: flex-start; background: transparent; border: none; padding: 2px 2px; max-width: 100%; }
  .msg.bot.pending { color: var(--muted); font-style: italic; }
  /* Actions sous chaque réponse */
  .msg-actions { align-self: flex-start; display: flex; gap: 4px; margin: -6px 0 2px 2px; flex-wrap: wrap; }
  .msg-actions button { display: inline-flex; align-items: center; gap: 5px; background: none; border: none; color: var(--muted); cursor: pointer; padding: 5px 8px; border-radius: 7px; font-family: inherit; font-size: 12px; transition: color var(--t-fast), background var(--t-fast); }
  .msg-actions button:hover { color: var(--orange); background: var(--surface); }
  .msg-actions svg { width: 14px; height: 14px; }
  .msg img, .msg video { max-width: 100%; border-radius: 10px; display: block; border: 1px solid var(--line); }
  .msg .thumb { width: 120px; height: auto; margin-bottom: 8px; }
  .msg .dl { display: inline-flex; align-items: center; gap: 8px; margin-top: 10px; padding: 8px 14px; border-radius: 9px; background: var(--surface-2); border: 1px solid var(--line-strong); color: var(--text); text-decoration: none; font-weight: 600; font-size: 13px; transition: color var(--t-fast), border-color var(--t-fast); }
  .msg .dl svg { width: 15px; height: 15px; border: none; }
  .msg .dl:hover { color: var(--orange); border-color: var(--orange); }
  .thread-empty { color: var(--muted); text-align: center; font-size: 14px; padding: 40px 10px; margin: auto; }

  /* ---------- Composer (bas de page) ---------- */
  .composer { flex: none; }
  .attach-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .attach-chip { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--orange); border-radius: 10px; padding: 6px 8px; font-size: 12.5px; color: var(--muted); }
  .attach-chip img { width: 34px; height: 34px; border-radius: 6px; object-fit: cover; }
  .attach-chip .ic { width: 30px; height: 30px; border-radius: 6px; display: flex; align-items: center; justify-content: center; background: var(--surface-2); color: var(--orange); }
  .attach-chip .ic svg { width: 16px; height: 16px; }
  .attach-chip button { background: none; border: none; color: var(--muted); cursor: pointer; text-decoration: underline; font-family: inherit; font-size: 12px; }
  .attach-chip button:hover { color: var(--red); }
  .chat-row { display: flex; gap: 8px; align-items: stretch; }
  .chat-row textarea { min-height: 52px; }
  .chat-attach { flex: none; width: 50px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius); cursor: pointer; background: var(--surface); border: 1px solid var(--line-strong); color: var(--muted); transition: color var(--t-fast), border-color var(--t-fast); }
  .chat-attach:hover, .chat-attach.has-file { color: var(--orange); border-color: var(--orange); }
  .chat-attach svg { width: 18px; height: 18px; }
  .send-btn { flex: none; width: 50px; height: 52px; border: none; border-radius: 50%; cursor: pointer; background: var(--orange); color: #fff; display: flex; align-items: center; justify-content: center; align-self: flex-end; transition: background var(--t-fast), transform var(--t-fast); }
  .send-btn svg { width: 20px; height: 20px; }
  .send-btn:hover:not(:disabled) { background: var(--orange-hover); }
  .send-btn:active:not(:disabled) { transform: scale(.93); }
  .send-btn:disabled { opacity: .55; cursor: not-allowed; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .res-row { display: none; align-items: center; gap: 10px; margin-bottom: 10px; }
  .res-row .lbl-inline { font-size: 12.5px; color: var(--muted); font-weight: 600; }
  .res-row select { background: var(--surface); border: 1px solid var(--line-strong); color: var(--text); border-radius: 9px; padding: 8px 10px; font-family: inherit; font-size: 13px; cursor: pointer; }
  .res-row select:focus { outline: none; border-color: var(--orange); }
  #status, #chatStatus { margin-top: 10px; text-align: center; font-size: 13px; min-height: 18px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  #status.err { color: var(--red); }
  #status.ok { color: var(--green); }
  #status svg { width: 15px; height: 15px; }

  label.lbl { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 8px; }
  textarea { width: 100%; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius); color: var(--text); padding: 13px 14px; font-family: inherit; font-size: 15px; resize: vertical; transition: border-color var(--t-fast), box-shadow var(--t-fast); }
  textarea:focus { outline: none; border-color: var(--orange); box-shadow: 0 0 0 3px rgba(255,122,26,.13); }

  .spinner { display: inline-block; width: 15px; height: 15px; border: 2px solid var(--line-strong); border-top-color: var(--orange); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Chat clear ---------- */
  .chat-head { display: flex; justify-content: flex-end; margin-bottom: 6px; flex: none; }
  .chat-clear { background: none; border: none; color: var(--muted); font-family: inherit; font-size: 12px; cursor: pointer; text-decoration: underline; }
  .chat-clear:hover { color: var(--orange); }

  /* ---------- Overlay (mobile) ---------- */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 25; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .overlay.open { opacity: 1; pointer-events: auto; }

  /* ---------- Responsive ---------- */
  @media (max-width: 820px) {
    .sidebar { position: fixed; top: 0; left: 0; bottom: 0; height: 100%; width: 280px; max-width: 84vw; z-index: 30; transform: translateX(-100%); transition: transform .25s var(--ease); box-shadow: 0 0 60px rgba(0,0,0,.6); }
    .sidebar.open { transform: none; }
    .drawer-close { display: block; }
    .menu-btn { display: inline-flex; }
    .main { height: 100vh; }
  }
  @media (max-width: 600px) {
    .content { padding: 14px 12px 16px; }
    textarea { font-size: 16px; }
    .msg { max-width: 92%; }
    .chat-row { flex-wrap: wrap; }
    .chat-row textarea { flex: 1 1 100%; order: 1; }
    .chat-attach { order: 2; }
    .send-btn { order: 3; flex: 1; width: auto; height: 46px; border-radius: var(--radius); }
  }
</style>
</head>
<body>

<div class="layout">

  <!-- Sidebar : navigation + historique -->
  <aside class="sidebar" id="drawer" aria-label="Navigation et historique">
    <div class="side-top">
      <div class="brand"><span class="brand-dot" aria-hidden="true"></span> Générateur <b>IA</b></div>
      <button class="drawer-close" id="drawerClose" aria-label="Fermer le menu">&times;</button>
    </div>

    <nav class="nav" role="tablist" aria-label="Mode">
      <button type="button" class="tab active" data-tab="image" role="tab" aria-selected="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.6-3.6a2 2 0 0 0-2.8 0L6 20"/></svg>
        <span class="tab-label">Image</span>
      </button>
      <button type="button" class="tab" data-tab="video" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="14" height="16" rx="2"/><path d="m22 7-6 4 6 4z"/></svg>
        <span class="tab-label">Vidéo</span>
      </button>
      <button type="button" class="tab" data-tab="chat" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span class="tab-label">Chat</span>
      </button>
    </nav>

    <div class="side-section">
      <div class="side-title">Récents</div>
      <div class="hist-list" id="histList"></div>
    </div>

    <div class="side-foot">
      <div class="row2">
        <button class="hist-btn" id="backupLink">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          <span id="backupLinkLabel">Lier un fichier</span>
        </button>
        <button class="hist-btn" id="backupSave">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg>
          Enregistrer
        </button>
      </div>
      <div class="backup-status" id="backupStatus"></div>
      <div class="row2">
        <button class="hist-btn" id="histExport">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
          Exporter
        </button>
        <label class="hist-btn" for="histImportFile">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>
          Importer
        </label>
        <input type="file" id="histImportFile" accept="application/json,.json" hidden />
      </div>
      <button class="hist-clear" id="histClear">Effacer l'historique</button>
    </div>
  </aside>

  <!-- Contenu principal -->
  <main class="main">
    <header class="topbar">
      <button class="menu-btn" id="histToggle" aria-controls="drawer" aria-haspopup="true" aria-label="Ouvrir le menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h18"/><path d="M3 6h18"/><path d="M3 18h18"/></svg>
      </button>
      <h1 id="mainTitle">Génération d'image</h1>
    </header>

    <div class="content">
      <!-- Panneau génération (image + vidéo) en mode conversation -->
      <div class="panel active" id="genPanel">
        <div class="thread" id="genLog">
          <div class="thread-empty" id="genEmpty">Décris ce que tu veux générer, puis clique sur Générer.</div>
        </div>
        <div class="composer">
          <div class="res-row" id="resRow">
            <span class="lbl-inline">Qualité</span>
            <select id="resSelect" aria-label="Qualité du rendu vidéo">
              <option value="720p">720p</option>
              <option value="1080p" selected>1080p (Full HD)</option>
              <option value="4k">4K (max)</option>
            </select>
          </div>
          <div class="attach-row" id="attachRow"></div>
          <div class="chat-row">
            <label class="chat-attach" for="imageFile" title="Joindre une image">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.6-3.6a2 2 0 0 0-2.8 0L6 20"/></svg>
            </label>
            <input type="file" id="imageFile" accept="image/*" hidden />
            <label class="chat-attach" id="videoAttach" for="videoFile" title="Joindre une vidéo (pour l'animer/éditer)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="14" height="16" rx="2"/><path d="m22 7-6 4 6 4z"/></svg>
            </label>
            <input type="file" id="videoFile" accept="video/*" hidden />
            <textarea id="prompt" placeholder="Décris ce que tu veux générer…"></textarea>
            <button class="send-btn" id="goBtn" aria-label="Générer" title="Générer">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
            </button>
          </div>
          <div class="hint" id="uploadHint">Joins une image pour la transformer (optionnel). L'anglais marche souvent mieux pour la qualité.</div>
          <div id="status"></div>
        </div>
      </div>

      <!-- Panneau chat (Claude Sonnet 4.6) -->
      <div class="panel" id="chatPanel">
        <div class="chat-head">
          <button class="chat-clear" id="chatClear">Nouvelle conversation</button>
        </div>
        <div class="thread" id="chatLog">
          <div class="thread-empty">Pose ta question à Claude Sonnet 4.6</div>
        </div>
        <div class="composer">
          <div class="attach-row" id="chatAttachRow"></div>
          <div class="chat-row">
            <label class="chat-attach" id="chatAttach" for="chatImageFile" title="Joindre une image">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
            </label>
            <input type="file" id="chatImageFile" accept="image/*" hidden />
            <textarea id="chatInput" placeholder="Écris ton message…"></textarea>
            <button class="send-btn" id="chatSend" aria-label="Envoyer" title="Envoyer">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div class="overlay" id="overlay"></div>
</div>

<script>
  const ICON = {
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
    warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.7 18-8-14a2 2 0 0 0-3.4 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>',
    download: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>',
    vid: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="14" height="16" rx="2"/><path d="m22 7-6 4 6 4z"/></svg>',
    refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg>',
    copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
  };

  // Construit une rangée de boutons d'action sous un message
  function actionsRow(buttons) {
    const row = document.createElement("div");
    row.className = "msg-actions";
    buttons.forEach((b) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.title = b.title;
      btn.setAttribute("aria-label", b.title);
      btn.innerHTML = b.icon + (b.label ? "<span>" + b.label + "</span>" : "");
      btn.onclick = b.onClick;
      row.appendChild(btn);
    });
    return row;
  }
  function flashLabel(btn, txt) {
    const span = btn.querySelector("span");
    if (!span) return;
    const old = span.textContent; span.textContent = txt;
    setTimeout(() => { span.textContent = old; }, 1200);
  }

  let currentType = "image";

  const tabs = document.querySelectorAll(".tab");
  const genPanel = document.getElementById("genPanel");
  const chatPanel = document.getElementById("chatPanel");
  const goBtn = document.getElementById("goBtn");
  const statusEl = document.getElementById("status");
  const uploadHint = document.getElementById("uploadHint");
  const mainTitle = document.getElementById("mainTitle");
  const videoAttach = document.getElementById("videoAttach");
  const resRow = document.getElementById("resRow");
  const resSelect = document.getElementById("resSelect");

  function selectTab(which) {
    tabs.forEach((t) => {
      const on = t.dataset.tab === which;
      t.classList.toggle("active", on);
      t.setAttribute("aria-selected", on ? "true" : "false");
    });
    const titles = { image: "Génération d'image", video: "Génération de vidéo", chat: "Chat — Claude Sonnet 4.6" };
    if (mainTitle) mainTitle.textContent = titles[which] || "Générateur IA";
    if (which === "chat") {
      genPanel.classList.remove("active");
      chatPanel.classList.add("active");
      return;
    }
    chatPanel.classList.remove("active");
    genPanel.classList.add("active");
    currentType = which;
    if (currentType === "video") {
      videoAttach.style.display = "flex";
      resRow.style.display = "flex";
      document.getElementById("prompt").placeholder = "Décris la vidéo (ou le mouvement si tu joins une image/vidéo)…";
      uploadHint.textContent = "Qualité : 720p et 1080p natifs (Kling). « 4K » = qualité max du modèle (rendu en 1080p).";
    } else {
      videoAttach.style.display = "none";
      resRow.style.display = "none";
      clearVideo();
      document.getElementById("prompt").placeholder = "Décris ce que tu veux générer…";

    }

  tabs.forEach((tab, i) => {
    tab.addEventListener("click", () => {
      selectTab(tab.dataset.tab);
      if (window.innerWidth <= 820) closeDrawer();
    });
    tab.addEventListener("keydown", (e) => {
      if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
      e.preventDefault();
      const next = e.key === "ArrowRight" ? (i + 1) % tabs.length : (i - 1 + tabs.length) % tabs.length;
      tabs[next].focus();
      selectTab(tabs[next].dataset.tab);
    });
  });

  /* ----- Compression d'image ----- */
  function compressImage(file, cb) {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const max = 1280;
        let { width, height } = img;
        if (width > max || height > max) {
          const ratio = Math.min(max / width, max / height);
          width = Math.round(width * ratio);
          height = Math.round(height * ratio);
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        cb(canvas.toDataURL("image/jpeg", 0.9));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }
  function readFile(file, cb) {
    const reader = new FileReader();
    reader.onload = (e) => cb(e.target.result);
    reader.readAsDataURL(file);
  }

  /* ----- Pièces jointes de la génération ----- */
  const imageFile = document.getElementById("imageFile");
  const videoFile = document.getElementById("videoFile");
  const attachRow = document.getElementById("attachRow");
  let selectedImageData = null;
  let selectedVideoData = null;
  const MAX_VIDEO_BYTES = 3.5 * 1024 * 1024; // limite serveur (Vercel ~4.5 Mo de corps)

  function renderAttachments() {
    attachRow.innerHTML = "";
    if (selectedImageData) {
      const chip = document.createElement("div");
      chip.className = "attach-chip";
      chip.innerHTML = '<img src="' + selectedImageData + '" alt="" /><span>Image</span>';
      const b = document.createElement("button"); b.type = "button"; b.textContent = "Retirer";
      b.onclick = () => { selectedImageData = null; imageFile.value = ""; renderAttachments(); };
      chip.appendChild(b);
      attachRow.appendChild(chip);
    }
    if (selectedVideoData) {
      const chip = document.createElement("div");
      chip.className = "attach-chip";
      chip.innerHTML = '<span class="ic">' + ICON.vid + "</span><span>Vidéo</span>";
      const b = document.createElement("button"); b.type = "button"; b.textContent = "Retirer";
      b.onclick = () => clearVideo();
      chip.appendChild(b);
      attachRow.appendChild(chip);
    }
  }
  function clearVideo() { selectedVideoData = null; videoFile.value = ""; renderAttachments(); }

  imageFile.addEventListener("change", () => {
    const file = imageFile.files && imageFile.files[0];
    if (!file) return;
    compressImage(file, (data) => { selectedImageData = data; renderAttachments(); });
  });
  videoFile.addEventListener("change", () => {
    const file = videoFile.files && videoFile.files[0];
    if (!file) return;
    if (file.size > MAX_VIDEO_BYTES) {
      setStatus("warn", "Vidéo trop lourde (max ~3 Mo ici). Utilise un clip plus court / plus léger.", true);
      videoFile.value = "";
      return;
    }
    readFile(file, (data) => { selectedVideoData = data; renderAttachments(); });
  });

  /* ----- Fil de génération ----- */
  const genLog = document.getElementById("genLog");
  function clearGenEmpty() { const e = document.getElementById("genEmpty"); if (e) e.remove(); }
  function genAddUser(text, imageData) {
    clearGenEmpty();
    const div = document.createElement("div");
    div.className = "msg user";
    if (imageData) { const im = document.createElement("img"); im.className = "thumb"; im.src = imageData; div.appendChild(im); }
    if (text) { const s = document.createElement("span"); s.textContent = text; div.appendChild(s); }
    genLog.appendChild(div);
    genLog.scrollTop = genLog.scrollHeight;
  }
  function genAddPending(label) {
    clearGenEmpty();
    const div = document.createElement("div");
    div.className = "msg bot pending";
    div.innerHTML = '<span class="spinner"></span> ' + label;
    genLog.appendChild(div);
    genLog.scrollTop = genLog.scrollHeight;
    return div;
  }
  function genFillMedia(bubble, type, url) {
    bubble.classList.remove("pending");
    bubble.innerHTML = type === "video"
      ? '<video src="' + url + '" controls autoplay loop playsinline></video>'
      : '<img src="' + url + '" alt="Image générée" loading="lazy" />';
    genLog.scrollTop = genLog.scrollHeight;
  }
  function downloadUrl(url) {
    const a = document.createElement("a");
    a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer"; a.download = "";
    document.body.appendChild(a); a.click(); a.remove();
  }
  function addGenActions(afterBubble, params, url) {
    const row = actionsRow([
      { icon: ICON.download, label: "Télécharger", title: "Télécharger", onClick: () => downloadUrl(url) },
      { icon: ICON.refresh, label: "Régénérer", title: "Régénérer", onClick: () => runGeneration(params, false) },
      { icon: ICON.copy, label: "Copier le prompt", title: "Copier le prompt", onClick: (e) => { if (navigator.clipboard) navigator.clipboard.writeText(params.prompt); flashLabel(e.currentTarget, "Copié !"); } },
    ]);
    afterBubble.insertAdjacentElement("afterend", row);
  }

  async function runGeneration(params, addUser) {
    const { type, prompt, image, video, resolution } = params;
    if (addUser !== false) genAddUser(prompt, image || null);
    const pending = genAddPending(type === "video" ? "Génération de la vidéo… (1 à 3 min)" : "Génération de l'image…");
    try {
      const res = await fetch("/api/generate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ type, prompt, image: image || undefined, video: video || undefined, resolution: resolution || undefined }),
      });
      const data = await res.json();
      if (!res.ok || !data.url) throw new Error(data.error || "Échec de la génération.");
      genFillMedia(pending, type, data.url);
      addGenActions(pending, params, data.url);
      saveHistory({ type, prompt, url: data.url, ts: Date.now() });
    } catch (err) {
      pending.classList.remove("pending");
      pending.style.color = "var(--red)";
      pending.textContent = "⚠ " + (err.message || "Une erreur est survenue.");
    }
  }

  goBtn.addEventListener("click", async () => {
    const prompt = document.getElementById("prompt").value.trim();
    if (!prompt) { setStatus("warn", "Écris d'abord un prompt.", true); return; }
    setStatus("", "");
    const params = {
      type: currentType,
      prompt,
      image: currentType !== "chat" ? selectedImageData : null,
      video: currentType === "video" ? selectedVideoData : null,
      resolution: currentType === "video" ? resSelect.value : undefined,
    };
    document.getElementById("prompt").value = "";
    selectedImageData = null; selectedVideoData = null; imageFile.value = ""; videoFile.value = "";
    renderAttachments();
    goBtn.disabled = true;
    await runGeneration(params, true);
    goBtn.disabled = false;
  });

  function setStatus(kind, text, isError) {
    let icon = "";
    if (kind === "spinner") icon = '<span class="spinner"></span>';
    else if (kind === "ok") icon = ICON.check;
    else if (kind === "warn") icon = ICON.warn;
    statusEl.innerHTML = text ? icon + "<span>" + text + "</span>" : "";
    statusEl.className = isError ? "err" : kind === "ok" ? "ok" : "";
  }

  /* ----- Historique local (localStorage) ----- */
  const HISTORY_KEY = "genia_history";
  const histList = document.getElementById("histList");
  const drawer = document.getElementById("drawer");
  const overlay = document.getElementById("overlay");

  function getHistory() {
    try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; }
    catch { return []; }
  }
  function saveHistory(item) {
    const list = getHistory();
    list.unshift(item);
    localStorage.setItem(HISTORY_KEY, JSON.stringify(list.slice(0, 40)));
    renderHistory();
    writeBackup();
  }
  function renderHistory() {
    const list = getHistory();
    if (!list.length) {
      histList.innerHTML = '<div class="hist-empty">Aucune génération pour l\'instant.</div>';
      return;
    }
    histList.innerHTML = list.map((it, i) => {
      const thumb = it.type === "image"
        ? '<img src="' + it.url + '" alt="" />'
        : '<div class="hist-thumb-icon">' + ICON.vid + "</div>";
      const label = it.type === "image" ? "Image" : "Vidéo";
      const p = (it.prompt || "").replace(/</g, "&lt;");
      return '<div class="hist-item" data-i="' + i + '">' + thumb +
        '<div class="hist-meta"><div class="t">' + label + '</div><div class="p">' + p + "</div></div></div>";
    }).join("");
    histList.querySelectorAll(".hist-item").forEach((el) => {
      el.addEventListener("click", () => {
        const it = getHistory()[+el.dataset.i];
        if (!it) return;
        selectTab(it.type);
        clearGenEmpty();
        const u = document.createElement("div"); u.className = "msg user";
        const s = document.createElement("span"); s.textContent = it.prompt || ""; u.appendChild(s);
        genLog.appendChild(u);
        const b = document.createElement("div"); b.className = "msg bot"; genLog.appendChild(b);
        genFillMedia(b, it.type, it.url);
        closeDrawer();
      });
    });
  }
  const histToggleBtn = document.getElementById("histToggle");
  const drawerCloseBtn = document.getElementById("drawerClose");
  function openDrawer() {
    drawer.classList.add("open"); overlay.classList.add("open");
    histToggleBtn.setAttribute("aria-expanded", "true");
    drawerCloseBtn.focus();
  }
  function closeDrawer() {
    drawer.classList.remove("open"); overlay.classList.remove("open");
    histToggleBtn.setAttribute("aria-expanded", "false");
  }
  histToggleBtn.setAttribute("aria-expanded", "false");
  histToggleBtn.addEventListener("click", openDrawer);
  drawerCloseBtn.addEventListener("click", closeDrawer);
  overlay.addEventListener("click", closeDrawer);
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && drawer.classList.contains("open")) closeDrawer();
  });
  document.getElementById("histClear").addEventListener("click", () => {
    if (confirm("Effacer tout l'historique ?")) {
      localStorage.removeItem(HISTORY_KEY); renderHistory();
    }
  });

  /* ----- Export / Import ----- */
  document.getElementById("histExport").addEventListener("click", () => {
    const data = {
      app: "generateur-ia", version: 1, exportedAt: new Date().toISOString(),
      generations: JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]"),
      chat: JSON.parse(localStorage.getItem("genia_chat") || "[]"),
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "historique-generateur-ia-" + new Date().toISOString().slice(0, 10) + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(a.href);
  });
  document.getElementById("histImportFile").addEventListener("change", (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if (data.app !== "generateur-ia") {
          if (!confirm("Ce fichier ne semble pas venir de cet outil. L'importer quand même ?")) return;
        }
        if (Array.isArray(data.generations)) localStorage.setItem(HISTORY_KEY, JSON.stringify(data.generations));
        if (Array.isArray(data.chat)) localStorage.setItem("genia_chat", JSON.stringify(data.chat));
        alert("Historique importé. La page va se recharger.");
        location.reload();
      } catch (err) { alert("Fichier invalide : impossible de lire l'historique."); }
    };
    reader.readAsText(file);
    e.target.value = "";
  });

  /* ----- Sauvegarde automatique vers un fichier ----- */
  const backupLinkBtn = document.getElementById("backupLink");
  const backupLinkLabel = document.getElementById("backupLinkLabel");
  const backupSaveBtn = document.getElementById("backupSave");
  const backupStatus = document.getElementById("backupStatus");
  let backupHandle = null;
  const SUPPORTED = typeof window.showSaveFilePicker === "function";

  function idb(mode, fn) {
    return new Promise((resolve) => {
      const open = indexedDB.open("genia_db", 1);
      open.onupgradeneeded = () => open.result.createObjectStore("kv");
      open.onsuccess = () => {
        const store = open.result.transaction("kv", mode).objectStore("kv");
        const req = fn(store);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => resolve(null);
      };
      open.onerror = () => resolve(null);
    });
  }
  const idbGet = (k) => idb("readonly", (s) => s.get(k));
  const idbSet = (k, v) => idb("readwrite", (s) => s.put(v, k));

  function currentData() {
    return {
      app: "generateur-ia", version: 1, exportedAt: new Date().toISOString(),
      generations: JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]"),
      chat: JSON.parse(localStorage.getItem("genia_chat") || "[]"),
    };
  }
  async function writeBackup() {
    if (!backupHandle) return;
    try {
      const writable = await backupHandle.createWritable();
      await writable.write(JSON.stringify(currentData(), null, 2));
      await writable.close();
      setBackupStatus("active", "Sauvegarde auto active — fichier mis à jour.");
    } catch (e) {
      setBackupStatus("warn", "Sauvegarde en pause — clique pour reconnecter le fichier.");
    }
  }
  function setBackupStatus(kind, text) {
    backupStatus.className = "backup-status" + (kind ? " " + kind : "");
    backupStatus.textContent = text;
    if (kind === "active") backupLinkLabel.textContent = "Fichier lié ✓";
    else if (kind === "warn") backupLinkLabel.textContent = "Reconnecter";
    else backupLinkLabel.textContent = "Lier un fichier";
    backupSaveBtn.disabled = !backupHandle;
  }
  async function linkBackupFile() {
    if (!SUPPORTED) {
      setBackupStatus("warn", "Non supporté ici. Utilise Exporter/Importer (Chrome ou Edge recommandé).");
      return;
    }
    if (backupHandle) {
      const perm = await backupHandle.requestPermission({ mode: "readwrite" });
      if (perm === "granted") { await writeBackup(); } else { setBackupStatus("warn", "Permission refusée."); }
      return;
    }
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: "historique-generateur-ia.json",
        types: [{ description: "JSON", accept: { "application/json": [".json"] } }],
      });
      backupHandle = handle;
      await idbSet("backupHandle", handle);
      await writeBackup();
    } catch (e) { /* annulé */ }
  }
  async function saveNow() {
    if (!backupHandle) { setBackupStatus("warn", "Lie d'abord un fichier pour pouvoir enregistrer."); return; }
    await writeBackup();
  }
  backupLinkBtn.addEventListener("click", linkBackupFile);
  backupSaveBtn.addEventListener("click", saveNow);
  async function initBackup() {
    if (!SUPPORTED) { setBackupStatus("", "Sauvegarde auto indisponible (Chrome/Edge requis)."); return; }
    const saved = await idbGet("backupHandle");
    if (saved) {
      backupHandle = saved;
      const perm = await saved.queryPermission({ mode: "readwrite" });
      if (perm === "granted") setBackupStatus("active", "Sauvegarde auto active.");
      else setBackupStatus("warn", "Fichier mémorisé — clique pour reconnecter.");
    } else {
      setBackupStatus("", "Lie un fichier pour enregistrer automatiquement.");
    }
  }

  /* ----- Chat avec Claude Sonnet 4.6 (persistant) ----- */
  const CHAT_KEY = "genia_chat";
  const chatLog = document.getElementById("chatLog");
  const chatInput = document.getElementById("chatInput");
  const chatSend = document.getElementById("chatSend");
  const chatImageFile = document.getElementById("chatImageFile");
  const chatAttach = document.getElementById("chatAttach");
  const chatAttachRow = document.getElementById("chatAttachRow");
  let chatImageData = null;
  let history = [];
  try { history = JSON.parse(localStorage.getItem(CHAT_KEY)) || []; } catch { history = []; }

  function saveChat() {
    const light = history.map((m) => ({ role: m.role, content: m.content }));
    try { localStorage.setItem(CHAT_KEY, JSON.stringify(light.slice(-40))); } catch (e) {}
    writeBackup();
  }
  function addMessage(role, text, extraClass, imageData) {
    const empty = chatLog.querySelector(".thread-empty");
    if (empty) empty.remove();
    const div = document.createElement("div");
    div.className = "msg " + (role === "user" ? "user" : "bot") + (extraClass ? " " + extraClass : "");
    if (imageData) { const im = document.createElement("img"); im.className = "thumb"; im.src = imageData; div.appendChild(im); }
    if (text) { const span = document.createElement("span"); span.textContent = text; div.appendChild(span); }
    chatLog.appendChild(div);
    chatLog.scrollTop = chatLog.scrollHeight;
    return div;
  }
  history.forEach((m) => addMessage(m.role, m.content));

  function renderChatAttach() {
    chatAttachRow.innerHTML = "";
    if (!chatImageData) return;
    const chip = document.createElement("div");
    chip.className = "attach-chip";
    chip.innerHTML = '<img src="' + chatImageData + '" alt="" /><span>Image</span>';
    const b = document.createElement("button"); b.type = "button"; b.textContent = "Retirer";
    b.onclick = () => { chatImageData = null; chatImageFile.value = ""; chatAttach.classList.remove("has-file"); renderChatAttach(); };
    chip.appendChild(b);
    chatAttachRow.appendChild(chip);
  }
  chatImageFile.addEventListener("change", () => {
    const file = chatImageFile.files && chatImageFile.files[0];
    if (!file) return;
    compressImage(file, (data) => { chatImageData = data; chatAttach.classList.add("has-file"); renderChatAttach(); });
  });

  function addChatActions(bubble, text) {
    const row = actionsRow([
      { icon: ICON.copy, label: "Copier", title: "Copier", onClick: (e) => { if (navigator.clipboard) navigator.clipboard.writeText(text); flashLabel(e.currentTarget, "Copié !"); } },
      { icon: ICON.refresh, label: "Régénérer", title: "Régénérer", onClick: (e) => {
          if (history.length && history[history.length - 1].role === "assistant") history.pop();
          saveChat();
          const r = e.currentTarget.closest(".msg-actions"); if (r) r.remove();
          fillClaudeReply(bubble);
        } },
    ]);
    bubble.insertAdjacentElement("afterend", row);
  }
  async function fillClaudeReply(bubble) {
    bubble.className = "msg bot pending"; bubble.style.color = ""; bubble.textContent = "Claude réfléchit…";
    chatSend.disabled = true;
    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history }),
      });
      const data = await res.json();
      if (!res.ok || !data.reply) throw new Error(data.error || "Échec de la réponse.");
      bubble.classList.remove("pending");
      bubble.textContent = data.reply;
      history.push({ role: "assistant", content: data.reply });
      saveChat();
      addChatActions(bubble, data.reply);
    } catch (err) {
      bubble.classList.remove("pending");
      bubble.style.color = "var(--red)";
      bubble.textContent = "⚠ " + (err.message || "Erreur.");
    } finally {
      chatSend.disabled = false;
      chatLog.scrollTop = chatLog.scrollHeight;
    }
  }
  async function sendChat() {
    const text = chatInput.value.trim();
    if (!text && !chatImageData) return;
    const img = chatImageData;
    addMessage("user", text, null, img);
    history.push({ role: "user", content: text, image: img || undefined });
    saveChat();
    chatInput.value = "";
    chatImageData = null; chatImageFile.value = ""; chatAttach.classList.remove("has-file"); renderChatAttach();
    const bubble = addMessage("assistant", "", "pending");
    await fillClaudeReply(bubble);
  }
  chatSend.addEventListener("click", sendChat);
  chatInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendChat(); }
  });
  document.getElementById("chatClear").addEventListener("click", () => {
    history = []; saveChat();
    chatLog.innerHTML = '<div class="thread-empty">Pose ta question à Claude Sonnet 4.6</div>';
  });

  // Init
  selectTab("image");
  renderHistory();
  initBackup();
</script>
